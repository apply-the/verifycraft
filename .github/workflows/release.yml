name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-matrix:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

  verify:
    name: Verify release
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+)?$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from importlib.metadata import version
          import verifycraft
          with open("pyproject.toml", "rb") as file:
              declared = tomllib.load(file)["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{declared}"
          assert verifycraft.__version__ == declared
          assert version("verifycraft") == declared
          PY

      - name: Run quality gates
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest --cov=verifycraft
          python -m benchmarks.evaluate

      - name: Build distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Upload verified distributions
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
