name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-gate:
    name: test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Verify tag is an ancestor of main branch
        shell: bash
        run: |
          echo "Verifying that tag $(git describe --tags --exact-match HEAD) commit is on origin/main..."
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release rejected: tag commit $(git rev-parse --short HEAD) is not present on origin/main."
            exit 1
          fi
          echo "Commit is confirmed on origin/main branch."

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter and formatting check
        run: |
          ruff check .
          ruff format --check .

      - name: Run type check
        run: mypy

      - name: Run test suite with coverage
        run: pytest --cov=verifycraft

      - name: Run benchmark contract evaluation
        run: python -m benchmarks.evaluate

  build:
    name: build
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYTHONPATH=src python -c "
          import tomllib, sys
          import verifycraft as v

          with open('pyproject.toml', 'rb') as f:
              pyproject_data = tomllib.load(f)
          pyproject_version = pyproject_data['project']['version']
          tag_version = '${TAG_VERSION}'

          print(f'Tag version: {tag_version}')
          print(f'pyproject.toml version: {pyproject_version}')
          print(f'verifycraft.__version__: {v.__version__}')

          if tag_version != pyproject_version:
              print(f'::error::Git tag (v{tag_version}) does not match pyproject.toml version ({pyproject_version})')
              sys.exit(1)

          if v.__version__ != pyproject_version:
              print(f'::error::Code version ({v.__version__}) does not match pyproject.toml version ({pyproject_version})')
              sys.exit(1)
          "

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: distributions
          path: dist/
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/verifycraft
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52e63fa25322d2ae6a75a5b104215b82364d3 # v1.12.4
        with:
          packages-dir: dist/
