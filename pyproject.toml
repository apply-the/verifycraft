[build-system]
requires = ["hatchling<1.32.0"]
build-backend = "hatchling.build"

[project]
name = "verifycraft"
version = "0.1.0"
description = "Composable review, testing, and verification capabilities for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "apply-the" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/apply-the/verifycraft"
Repository = "https://github.com/apply-the/verifycraft"
Issues = "https://github.com/apply-the/verifycraft/issues"

[project.optional-dependencies]
gemini = [
    "google-genai>=0.1.0",
]
openai = [
    "openai>=1.40.0",
]
anthropic = [
    "anthropic>=0.30.0",
]
bedrock = [
    "boto3>=1.34.0",
]
all-providers = [
    "google-genai>=0.1.0",
    "openai>=1.40.0",
    "anthropic>=0.30.0",
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "google-genai>=0.1.0",
    "openai>=1.40.0",
    "anthropic>=0.30.0",
    "boto3>=1.34.0",
    "boto3-stubs[bedrock-runtime]>=1.34.0",
]

[project.scripts]
verifycraft = "verifycraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verifycraft"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/verifycraft"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["verifycraft"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "google",
    "google.genai",
    "google.genai.*",
]
ignore_missing_imports = true

