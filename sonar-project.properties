sonar.projectKey=apply-the_verifycraft
sonar.organization=apply-the

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=verifycraft
sonar.projectVersion=0.1.0

# Path to source code and tests
sonar.sources=src
sonar.tests=tests

# Inclusions and exclusions
sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/.ruff_cache/**,**/.mypy_cache/**,build/**,dist/**
sonar.coverage.exclusions=tests/**,benchmarks/**,examples/**,scripts/**,docs/**

# Ignore CI pipeline pip installation rules (dependencies are locked in pyproject.toml and uv.lock)
sonar.issue.ignore.multicriteria=pipBinary,pipLock
sonar.issue.ignore.multicriteria.pipBinary.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.pipBinary.resourceKey=.github/workflows/*
sonar.issue.ignore.multicriteria.pipLock.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.pipLock.resourceKey=.github/workflows/*

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
